<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password – PTT Connect</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  body { margin:0; font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#0e1116; color:#e6edf3; display:grid; place-items:center; min-height:100vh; }
  .card { background:#161b22; border:1px solid #2a313c; border-radius:12px; padding:28px; max-width:380px; width:88%; text-align:center; }
  h1 { font-size:22px; margin:8px 0 4px; }
  input { width:100%; box-sizing:border-box; padding:12px; margin:8px 0; background:#0e1116; color:#e6edf3; border:1px solid #2a313c; border-radius:8px; font:inherit; }
  button { width:100%; padding:12px; margin-top:8px; border:0; border-radius:8px; background:#f47b20; color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; }
  .muted { color:#8b949e; font-size:14px; } .ok { color:#2ea043; } .bad { color:#f85149; }
  label { display:block; text-align:left; font-size:14px; color:#8b949e; margin-top:6px; }
</style>
</head>
<body>
<div class="card">
  <img src="/logo.png" width="100" height="100" alt="Infinity H Group">
  <h1>Choose a new password</h1>
  <div id="box"><p class="muted">Checking your reset link…</p></div>
</div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const box = document.getElementById("box");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fail = msg => box.innerHTML = `<p class="bad">${esc(msg)}</p><p class="muted">Open the app and tap <b>Forgot password?</b> again to get a new link.</p>`;

// Error coming back from Supabase (e.g. expired link)
const hash = new URLSearchParams(location.hash.slice(1));
const query = new URLSearchParams(location.search);
const err = hash.get("error_description") || query.get("error_description");
if (err) { fail(err.replace(/\+/g, " ")); throw new Error("link error"); }

const cfg = await fetch("/api/config").then(r => r.json());
const sb = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { detectSessionInUrl: true, persistSession: false } });

let shown = false;
function showForm() {
  if (shown) return; shown = true;
  box.innerHTML = `
    <label>New password (at least 8 characters)</label><input id="p1" type="password" autocomplete="new-password">
    <label>Type it again</label><input id="p2" type="password" autocomplete="new-password">
    <div id="msg" class="muted" style="min-height:1.4em"></div>
    <button id="save">Save new password</button>`;
  document.getElementById("save").onclick = async () => {
    const p1 = document.getElementById("p1").value, p2 = document.getElementById("p2").value, msg = document.getElementById("msg");
    if (p1.length < 8) return (msg.innerHTML = `<span class="bad">Use at least 8 characters.</span>`);
    if (p1 !== p2) return (msg.innerHTML = `<span class="bad">The two passwords are not the same.</span>`);
    const btn = document.getElementById("save"); btn.disabled = true; msg.textContent = "Saving…";
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) { btn.disabled = false; return (msg.innerHTML = `<span class="bad">${esc(error.message)}</span>`); }
    await sb.auth.signOut();
    box.innerHTML = `<p class="ok"><b>Your password has been changed.</b></p><p>Go back to the PTT Connect app and sign in with your new password.</p><p class="muted">You can close this page.</p>`;
  };
}

sb.auth.onAuthStateChange((event, session) => { if (session && (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN" || event === "INITIAL_SESSION")) showForm(); });
const { data } = await sb.auth.getSession();
if (data.session) showForm();
setTimeout(() => { if (!shown) fail("This reset link is invalid or has expired."); }, 6000);
</script>
</body>
</html>
