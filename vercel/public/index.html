<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTT Connect – Infinity H Group</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  body { margin:0; font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#0e1116; color:#e6edf3; display:grid; place-items:center; min-height:100vh; }
  .card { background:#161b22; border:1px solid #2a313c; border-radius:10px; padding:28px; max-width:420px; width:90%; }
  h1 { margin:0 0 6px; font-size:24px; }
  a.btn { display:inline-block; margin:14px 10px 0 0; padding:9px 16px; border-radius:6px; border:1px solid #2ea043; color:#2ea043; text-decoration:none; }
  .ok { color:#2ea043; } .bad { color:#f85149; } .muted { color:#8b949e; font-size:14px; }
  ul { padding-left:18px; margin:8px 0 0; }
</style>
</head>
<body>
<div class="card">
  <img src="/logo.png" alt="Infinity H Group" style="width:120px;height:120px;display:block;margin:0 auto 14px">
  <h1 style="text-align:center">PTT Connect server</h1>
  <div id="status" class="muted">Checking configuration…</div>
  <ul id="checks" class="muted"></ul>
  <a class="btn" href="/app/" style="border-color:#f47b20;color:#f47b20">Open web app</a>
  <a class="btn" href="/admin">Open admin</a>
  <a class="btn" href="/api/health">Health JSON</a>
</div>
<script>
if (/type=recovery|error_code=|access_token=/.test(location.hash + location.search)) {
  location.replace("/reset-password.html" + location.search + location.hash);
}
fetch("/api/health").then(r => r.json()).then(h => {
  const s = document.getElementById("status");
  s.innerHTML = h.ok ? '<span class="ok">● Everything is configured</span>' : '<span class="bad">● Setup incomplete – see below</span>';
  document.getElementById("checks").innerHTML = Object.entries(h.checks || {})
    .map(([k, v]) => { const good = v === "ok" || v.startsWith("set"), opt = v.startsWith("optional");
      return `<li><span class="${good ? "ok" : opt ? "muted" : "bad"}">${good ? "✓" : opt ? "–" : "✗"}</span> ${k}: ${v}</li>`; }).join("");
}).catch(() => {
  document.getElementById("status").innerHTML = '<span class="bad">● API not reachable – check that Root Directory is set to "vercel"</span>';
});
</script>
</body>
</html>
